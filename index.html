<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpaper Vault</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page">
    <header class="header">
      <div class="header__logo">WallPaper Vault</div>
      <button class="header__theme-toggle" id="themeBtn">Сменить тему</button>
    </header>

    <main class="main">
      <section class="banner">
        <p class="banner__text">
          Wallpaper Vault — экосистема твоих обоев. От минимализма до живых
          фонов.
        </p>
      </section>

      <div class="content">
        <nav class="nav-filters">
          <button
            class="nav-filters__btn nav-filters__btn--active"
            data-category="Desktop"
          >
            Desktop
          </button>
          <button class="nav-filters__btn" data-category="Phone">Phone</button>
          <button class="nav-filters__btn" data-category="iOS (tendies)">
            iOS (tendies)
          </button>
          <button class="nav-filters__btn" data-category="Wallpaper Engine">
            Wallpaper Engine
          </button>
        </nav>

        <div class="tags">
          <select class="tags__select" id="tagSelect">
            <option value="space">Космос</option>
            <option value="minimalism">Минимализм</option>
            <option value="nature">Природа</option>
            <option value="black">Темные</option>
            <option value="white">Светлые</option>
            <option value="city">Город</option>
            <option value="sky">Небо</option>
            <option value="car">Автомобили</option>
          </select>
        </div>

        <section class="gallery" id="gallery"></section>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__text">WallPaper Vault. Пономарев Даниил, 2171ДБ</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
